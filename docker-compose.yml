services:
  lanesignal:
    build: .
    image: lanesignal:latest
    restart: unless-stopped
    ports:
      # Bind to localhost and put a TLS reverse proxy in front (docs/reverse-proxy.md).
      # For Dockge or the published image, see deploy/dockge/compose.yaml.
      - "127.0.0.1:${LANESIGNAL_PORT:-8080}:8080"
    # The stack's .env (from .env.example; it must exist, even if empty). The short form works on
    # every Compose version; `path:`/`required:` needs Compose 2.24+.
    env_file: .env
    environment:
      # One reverse proxy in front (Caddy, Traefik, nginx, tailscale serve). See docs/reverse-proxy.md.
      LANESIGNAL_TRUST_PROXY: "${LANESIGNAL_TRUST_PROXY:-1}"
      # Features (docs/configuration.md#features). Answering on the dashboard is off: you answer in
      # the agent's session and the agent dismisses the alert. The requirements register is on.
      LANESIGNAL_DECISIONS: "${LANESIGNAL_DECISIONS:-true}"
      LANESIGNAL_REQUIREMENTS: "${LANESIGNAL_REQUIREMENTS:-true}"
    volumes:
      - lanesignal-data:/data
      - ./config:/config:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  lanesignal-data:
