name: Wiki

# Publishes docs/ to the repository wiki. docs/ stays the source: edits made in the wiki are overwritten.
# The wiki has to exist first: create any page once in the Wiki tab.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/docs-to-wiki.mjs', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: wiki

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: |
          find wiki -maxdepth 1 -name '*.md' -delete
          node scripts/docs-to-wiki.mjs docs wiki "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - working-directory: wiki
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898208+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish docs from $GITHUB_SHA"
          git push
