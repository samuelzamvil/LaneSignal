name: Wiki

# Publishes docs/ to the repository wiki. docs/ stays the source: edits made in the wiki are overwritten.
# The wiki has to exist first: create any page once in the Wiki tab.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/docs-to-wiki.mjs', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: wiki

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - id: wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          if git ls-remote "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.wiki.git" >/dev/null 2>&1; then
            echo exists=true >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The wiki doesn't exist yet: create any page in the Wiki tab, then re-run this workflow."
          fi
      - if: steps.wiki.outputs.exists
        uses: actions/checkout@v7
      - if: steps.wiki.outputs.exists
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - if: steps.wiki.outputs.exists
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.wiki.outputs.exists
        run: |
          find wiki -maxdepth 1 -name '*.md' -delete
          node scripts/docs-to-wiki.mjs docs wiki "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - if: steps.wiki.outputs.exists
        working-directory: wiki
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898208+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish docs from $GITHUB_SHA"
          git push
