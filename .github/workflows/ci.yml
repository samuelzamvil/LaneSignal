name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Weekly rebuild of main, so the published image picks up base-image security fixes.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lanesignal
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    needs: test
    # The weekly run only refreshes the server image.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The signing key lives in the "android-signing" environment, which only main and v* tags may use
    # (scripts/android-signing-setup.sh sets it up). Other builds, pull requests included, use none and
    # stay debug-signed.
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request' && 'android-signing' || '' }}
    env:
      LANESIGNAL_VERSION_CODE: ${{ github.run_number }}
      # Cloudflare Access sign-in: the server whose callback the app claims as an App Link (a repository
      # variable; optional, see docs/cloudflare-access.md).
      LANESIGNAL_APP_LINK_HOST: ${{ vars.LANESIGNAL_APP_LINK_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          # The default ("tools platform-tools") fails: the legacy "tools" package is gone.
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci

      # A v1.2.3 tag names the version; other builds are 0.1.0-<run number>.
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.0-$GITHUB_RUN_NUMBER"; fi
          echo "LANESIGNAL_VERSION_NAME=$v" >> "$GITHUB_ENV"

      # Push notifications need Firebase config. Without the secret the APK
      # still builds and works; it just doesn't register for push.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > web/android/app/google-services.json
            echo "VITE_FCM_ENABLED=true" >> "$GITHUB_ENV"
          fi

      - name: Build web + sync Capacitor
        working-directory: web
        run: npm run android:sync

      - name: Debug APK
        working-directory: web/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Release APK (when signing secrets are set)
        working-directory: web/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LANESIGNAL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LANESIGNAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LANESIGNAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No keystore secret; skipping release build"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          LANESIGNAL_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: lanesignal-apk
          path: |
            web/android/app/build/outputs/apk/debug/*.apk
            web/android/app/build/outputs/apk/release/*-release.apk
          if-no-files-found: error
          # The release job takes it from here within the same run; a public repo's artifacts
          # (pull-request builds included) needn't linger for GitHub's default 90 days. After a week,
          # re-run all jobs (or Run workflow) to release again: the release job alone finds nothing.
          retention-days: 7

  # Publishes the APK to the Releases page: main updates the "latest" pre-release, a v* tag gets its own.
  # A manual run (Actions → CI → Run workflow) republishes too, e.g. right after the signing key is set up.
  # A separate job, so the build above (npm, Gradle) never holds a token that can write to the repo.
  release:
    needs: android
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@v8
        with:
          name: lanesignal-apk
          path: apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          APK_DIR: apk
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.0-$GITHUB_RUN_NUMBER"; fi
          LANESIGNAL_VERSION_NAME="$v" scripts/release-apk.sh
